<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - New Power Auto Mecânica</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: #111111;
            font-size: 24px;
        }

        .subtitulo {
            color: #666666;
            margin: 8px 0 25px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin: 12px 0 5px;
            color: #333333;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #c5c5c5;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c40000;
        }

        .botao {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #111111;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            background: #c40000;
        }

        .link-esqueci {
            display: block;
            margin-top: 15px;
            color: #555555;
            text-decoration: none;
            font-size: 14px;
        }

        .link-esqueci:hover {
            color: #c40000;
        }

        .erro {
            margin-top: 15px;
            padding: 10px;
            background: #ffebee;
            border: 1px solid #e57373;
            color: #b71c1c;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="card">

        <img
            src="{{ url_for('static', filename='logo.jpg') }}"
            class="logo"
            alt="New Power Auto Mecânica"
        >

        <h1>
            New Power Auto Mecânica
        </h1>

        <div class="subtitulo">
            Acesso ao sistema da oficina
        </div>


        <!-- LOGIN -->

        <form method="POST" action="{{ url_for('login') }}">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
                autofocus
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="botao"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                ENTRAR

            </button>

        </form>


        <!-- ESQUECI A SENHA -->

        <a
            href="/esqueci-senha"
            class="link-esqueci"
        >
            Esqueci minha senha
        </a>


        <!-- MENSAGEM DE ERRO -->

        {% if mensagem %}

            <div class="erro">
                {{ mensagem }}
            </div>

        {% endif %}

    </div>

</body>
</html>
